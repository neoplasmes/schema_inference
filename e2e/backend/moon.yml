language: python
type: automation
dependsOn:
  - server

fileGroups:
  src:
    - '*.py'
    - flows/*.py
    - /infrastructure/docker/*.py
  cfg:
    - /apps/server/pyproject.toml
  server:
    - /apps/server/src/**/*.{py,sql,json}
    - /docker-compose*.yaml
    - /infrastructure/pgbouncer/*.{ini,txt}

tasks:
  test-e2e:
    command: uv run --no-sync pytest -c apps/server/pyproject.toml e2e/backend
    deps:
      - server:image
    env:
      PYTHONPATH: $workspaceRoot
    inputs:
      - '@group(src)'
      - '@group(cfg)'
      - '@group(server)'
    options:
      cache: false
      runFromWorkspaceRoot: true

  lint:
    command: uv run --no-sync ruff check --config apps/server/pyproject.toml e2e/backend infrastructure/docker
    options:
      runFromWorkspaceRoot: true
      mergeArgs: replace

  lint-fix:
    command: uv run --no-sync ruff check --fix --config apps/server/pyproject.toml e2e/backend infrastructure/docker
    options:
      runFromWorkspaceRoot: true
      mergeArgs: replace

  fmt:
    command: uv run --no-sync ruff format --config apps/server/pyproject.toml e2e/backend infrastructure/docker
    options:
      runFromWorkspaceRoot: true
      mergeArgs: replace

  typecheck:
    command: uv run --no-sync pyright --project apps/server/pyproject.toml e2e/backend
    inputs:
      - '@group(server)'
    env:
      PYTHONPATH: $workspaceRoot
    options:
      runFromWorkspaceRoot: true
      mergeArgs: replace

  start:
    command: uv run --no-sync python -m e2e.backend.serve
    env:
      PYTHONPATH: $workspaceRoot
    preset: server
