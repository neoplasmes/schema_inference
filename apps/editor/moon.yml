language: typescript
type: application

fileGroups:
  sources:
    - src/**/*
    - playground/**/*
    - scripts/**/*
    - index.html
  configs:
    - package.json
    - tsconfig.json
    - '*.config.*'

tasks:
  dev:
    command: pnpm exec tsx ./node_modules/webpack-cli/bin/cli.js serve --config webpack.config.ts --mode development
    local: true
    options:
      persistent: true
  playground:
    command: pnpm exec tsx ./node_modules/webpack-cli/bin/cli.js serve --config webpack.config.ts --mode development
    local: true
    options:
      persistent: true
  build:
    command: pnpm exec tsx scripts/build.ts
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /packages/entity-cache/src/**/*
    outputs:
      - dist
  typecheck:
    command: pnpm exec tsc --noEmit

  image:
    command: docker build -t schema-workspace-editor:development .
    deps:
      - ~:build
    inputs:
      - Dockerfile
      - .dockerignore
      - nginx.conf
    options:
      cache: false
  test-unit:
    command: pnpm exec vitest run
  lint:
    command: pnpm exec eslint src scripts playground visual webpack.config.ts
    deps:
      - ~:lint-architecture
  fmt:
    command: pnpm exec biome format --write .
    deps:
      - ~:fmt-markup
    options:
      cache: false
      runInCI: false
  fmt-markup:
    command: pnpm exec prettier --write index.html
    options:
      cache: false
      runInCI: false
  build-tokens:
    command: pnpm exec tsx scripts/sync-tokens.ts
    options:
      cache: false
      runInCI: false
  test-e2e-visual:
    command: pnpm exec tsx visual/run.ts
    local: true
  test-e2e-performance:
    command: pnpm exec tsx visual/perf.ts
    local: true

  lint-architecture:
    command: pnpm exec tsx scripts/check-architecture.ts
    inputs:
      - "@group(sources)"
      - "@group(configs)"
