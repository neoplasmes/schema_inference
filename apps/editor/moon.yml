language: typescript
type: application

fileGroups:
  sources:
    - src/**/*
    - playground/**/*
    - scripts/**/*
    - index.html
  configs:
    - package.json
    - tsconfig.json
    - '*.config.*'

tasks:
  dev:
    command: pnpm dev
    local: true
    options:
      persistent: true
  playground:
    command: pnpm playground
    local: true
    options:
      persistent: true
  build:
    command: pnpm exec tsx scripts/build.ts
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /packages/entity-cache/src/**/*
    outputs:
      - dist
  typecheck:
    command: pnpm typecheck
  test:
    command: pnpm test
  lint:
    command: pnpm lint
  fmt:
    command: pnpm exec biome format --write .
    deps:
      - ~:fmt-markup
    options:
      cache: false
      runInCI: false
  fmt-markup:
    command: pnpm exec prettier --write index.html
    options:
      cache: false
      runInCI: false
  sync-tokens:
    command: pnpm exec tsx scripts/sync-tokens.ts
    options:
      cache: false
      runInCI: false
  visual:
    command: pnpm visual
    local: true
  perf:
    command: pnpm perf
    local: true
