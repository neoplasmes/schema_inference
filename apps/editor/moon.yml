language: typescript
type: application
dependsOn:
  - entity-cache

fileGroups:
  code:
    - src/**/*.{ts,tsx,css}
    - scripts/**/*.ts
    - playground/**/*.ts
  src:
    - src/**/*.{ts,tsx,css}
    - '!src/**/*.test.{ts,tsx}'
    - playground/**/*.ts
  cfg:
    - package.json
    - tsconfig.json
    - webpack.config.ts
  assets:
    - index.html
  test-e2e:
    - visual/*.ts
  containers:
    - Dockerfile
    - .dockerignore
    - nginx.conf

tasks:
  dev:
    command: pnpm exec tsx ./node_modules/webpack-cli/bin/cli.js serve --config webpack.config.ts --mode development
    preset: server

  build:
    command: pnpm exec tsx scripts/build.ts
    inputs:
      - '@group(src)'
      - '@group(assets)'
      - '@group(cfg)'
      - '@group(shared-cache)'
      - scripts/build.ts
    outputs:
      - dist

  image:
    command: docker build -t schema-workspace-editor:development .
    deps:
      - editor:build
    inputs:
      - '@group(containers)'
      - '@group(src)'
      - '@group(assets)'
      - '@group(cfg)'
      - '@group(shared-cache)'
      - scripts/build.ts
    options:
      cache: false

  lint:
    command: pnpm exec eslint src scripts playground visual webpack.config.ts
    deps:
      - editor:lint-architecture

  fmt:
    deps:
      - editor:fmt-markup

  fmt-markup:
    command: pnpm exec prettier --write index.html
    options:
      cache: false
      runInCI: false

  build-tokens:
    command: pnpm exec tsx scripts/sync-tokens.ts
    options:
      cache: false
      runInCI: false

  test-e2e-visual:
    command: pnpm exec tsx visual/run.ts
    inputs:
      - '@group(src)'
      - '@group(test-e2e)'
      - '@group(cfg)'
    options:
      cache: false
      runInCI: false
      mutex: editor-browser

  test-e2e-performance:
    extends: test-e2e-visual
    command: pnpm exec tsx visual/perf.ts
    options:
      mergeArgs: replace

  lint-architecture:
    command: pnpm exec tsx scripts/check-architecture.ts
    inputs:
      - src/**/*.{ts,tsx}
      - scripts/check-architecture.ts
      - scripts/architecture/**/*.ts
