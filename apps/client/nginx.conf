worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 20m;

        location /api/ {
            proxy_pass http://server:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /editor/ {
            proxy_pass http://editor:8080/;
        }

        location = /editor-runtime.json {
            default_type application/json;
            add_header Cache-Control no-store;
            return 200 '{"editorManifestUrl":"$scheme://$http_host/editor/mf-manifest.json","apiBaseUrl":""}';
        }

        location = /workspace-runtime.json {
            add_header Cache-Control no-store;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
        }
    }

    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /stub_status {
            stub_status;
        }
    }
}
