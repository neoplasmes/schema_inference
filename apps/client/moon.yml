language: typescript
type: application

fileGroups:
  configs:
    - package.json
    - tsconfig.json
    - '*.config.{js,ts}'
  sources:
    - index.html
    - src/**/*
    - scripts/**/*
    - public/**/*
    - tests/**/*

tasks:
  dev:
    command: pnpm exec webpack serve --mode development
    deps:
      - editor:dev
    local: true
    options:
      persistent: true

  dev-api:
    command: pnpm exec webpack serve --mode development
    deps:
      - editor:dev
      - server:start
    env:
      WORKSPACE_MODE: api
    local: true
    options:
      persistent: true

  editor-types:
    command: pnpm exec tsx scripts/consume-editor-types.ts
    deps:
      - editor:build
    inputs:
      - scripts/consume-editor-types.ts
      - /apps/editor/dist/@mf-types.zip
    outputs:
      - '@mf-types'
    options:
      cache: false

  build:
    command: pnpm exec webpack --mode production
    deps:
      - ~:editor-types
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /packages/entity-cache/src/**/*
    outputs:
      - dist

  typecheck:
    command: pnpm exec tsc --noEmit
    deps:
      - ~:editor-types
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /packages/entity-cache/src/**/*

  test:
    command: pnpm exec vitest run
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /packages/entity-cache/src/**/*

  lint:
    command: pnpm exec eslint src scripts tests playwright.config.ts
    deps:
      - ~:architecture
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  architecture:
    command: pnpm exec tsx scripts/check-architecture.ts
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /apps/editor/scripts/architecture/**/*

  lint-fix:
    command: pnpm exec eslint --fix src scripts tests playwright.config.ts
    local: true

  fmt:
    command: pnpm exec biome format --write .
    deps:
      - ~:fmt-markup
    options:
      cache: false
      runInCI: false

  fmt-markup:
    command: pnpm exec prettier --write index.html
    options:
      cache: false
      runInCI: false

  install-browser:
    command: pnpm exec playwright install chromium
    options:
      cache: false
      runInCI: false

  e2e:
    command: pnpm exec playwright test
    deps:
      - ~:build
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /apps/editor/src/**/*
      - /packages/entity-cache/src/**/*
    options:
      cache: false

  serve-e2e:
    command: pnpm exec tsx scripts/serve-e2e.ts
    local: true
    options:
      persistent: true

  e2e-api:
    command: pnpm exec playwright test
    deps:
      - ~:build
      - ~:e2e
    env:
      WORKSPACE_MODE: api
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /apps/editor/src/**/*
      - /apps/server/src/**/*
      - /uv.lock
    options:
      cache: false
