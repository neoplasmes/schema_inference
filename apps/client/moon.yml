language: typescript
type: application
dependsOn:
  - entity-cache

fileGroups:
  cfg:
    - package.json
    - tsconfig.json
    - webpack.config.ts
    - vitest.config.js
    - playwright.config.ts
  test-e2e:
    - tests/**/*.ts
  assets:
    - index.html
    - public/*.json
  architecture:
    - /apps/editor/scripts/architecture/**/*.ts
  containers:
    - Dockerfile
    - .dockerignore
    - nginx.conf
  backend:
    - /e2e/backend/**/*.py
    - /apps/server/src/**/*.{py,sql,json}
    - /env/local/docker-compose*.yaml
    - /env/pgbouncer/*.{ini,txt}
    - /apps/server/pyproject.toml
    - /apps/server/Dockerfile
    - /env/docker/*.py
    - /uv.lock

tasks:
  dev:
    command: pnpm exec tsx scripts/dev.ts
    preset: server

  dev-web:
    command: pnpm exec tsx ./node_modules/webpack-cli/bin/cli.js serve --config webpack.config.ts --mode development
    preset: server

  build-types:
    command: pnpm exec tsx scripts/consume-editor-types.ts --local
    deps:
      - editor:build
    inputs:
      - scripts/consume-editor-types.ts
    outputs:
      - '@mf-types'

  build:
    command: pnpm exec tsx ./node_modules/webpack-cli/bin/cli.js --config webpack.config.ts --mode production
    deps:
      - client:build-types
    inputs:
      - '@group(src)'
      - '@group(assets)'
      - '@group(shared-cache)'
      - package.json
      - tsconfig.json
      - webpack.config.ts
    outputs:
      - dist

  typecheck:
    deps:
      - client:build-types
    inputs:
      - '@group(architecture)'

  image:
    command: docker build -t schema-workspace-client:development .
    deps:
      - client:build
    inputs:
      - '@group(containers)'
      - '@group(src)'
      - '@group(assets)'
      - '@group(cfg)'
      - '@group(shared-cache)'
    options:
      cache: false

  test-unit:
    inputs:
      - '@group(architecture)'

  lint:
    command: pnpm exec eslint src scripts tests playwright.config.ts webpack.config.ts
    deps:
      - client:lint-architecture

  lint-architecture:
    command: pnpm exec tsx scripts/check-architecture.ts
    inputs:
      - src/**/*.{ts,tsx}
      - '@group(architecture)'
      - scripts/check-architecture.ts

  fmt:
    deps:
      - client:fmt-markup

  fmt-markup:
    command: pnpm exec prettier --write index.html
    options:
      cache: false
      runInCI: false

  setup-browser:
    command: pnpm exec playwright install chromium
    options:
      cache: false
      runInCI: false

  test-e2e-mock:
    command: pnpm exec playwright test
    deps:
      - client:build
    env:
      WORKSPACE_MODE: mock
      WORKSPACE_CONTAINER: '0'
    inputs:
      - '@group(src)'
      - '@group(scripts)'
      - '@group(test-e2e)'
      - '@group(cfg)'
      - '@group(assets)'
      - '@group(shared-cache)'
      - /apps/editor/src/**/*.{ts,tsx,css}
    options: &browser-options
      cache: false
      mutex: client-browser

  start-e2e:
    command: pnpm exec tsx scripts/serve-e2e.ts
    preset: server

  test-e2e-api:
    extends: test-e2e-mock
    deps:
      - server:image
    env:
      WORKSPACE_MODE: api
    inputs:
      - '@group(backend)'

  test-e2e:
    command: pnpm exec playwright test
    deps:
      - client:image
      - editor:image
      - server:image
    env:
      WORKSPACE_MODE: api
      WORKSPACE_CONTAINER: '1'
    inputs:
      - '@group(backend)'
      - '@group(containers)'
      - '@group(src)'
      - '@group(scripts)'
      - '@group(test-e2e)'
      - '@group(cfg)'
      - '@group(assets)'
      - '@group(shared-cache)'
      - /apps/editor/src/**/*.{ts,tsx,css}
      - /apps/editor/nginx.conf
      - /apps/editor/Dockerfile
      - /apps/editor/.dockerignore
      - /apps/editor/webpack.config.ts
      - /apps/editor/scripts/build.ts
    options: *browser-options
