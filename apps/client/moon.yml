language: typescript
type: application

fileGroups:
  configs:
    - package.json
    - tsconfig.json
    - '*.config.{js,ts}'
  sources:
    - index.html
    - src/**/*
    - scripts/**/*
    - public/**/*
    - tests/**/*

tasks:
  dev:
    command: pnpm exec tsx scripts/dev.ts
    local: true
    options:
      persistent: true

  dev-api:
    command: pnpm exec tsx scripts/dev.ts
    env:
      WORKSPACE_MODE: api
    local: true
    options:
      persistent: true

  dev-web:
    command: pnpm exec tsx ./node_modules/webpack-cli/bin/cli.js serve --config webpack.config.ts --mode development
    local: true
    options:
      persistent: true

  build-types:
    command: pnpm exec tsx scripts/consume-editor-types.ts
    deps:
      - editor:build
    inputs:
      - scripts/consume-editor-types.ts
      - /apps/editor/dist/@mf-types.zip
    outputs:
      - '@mf-types'
    options:
      cache: false

  build:
    command: pnpm exec tsx ./node_modules/webpack-cli/bin/cli.js --config webpack.config.ts --mode production
    deps:
      - ~:build-types
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /packages/entity-cache/src/**/*
    outputs:
      - dist

  typecheck:
    command: pnpm exec tsc --noEmit
    deps:
      - ~:build-types
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /packages/entity-cache/src/**/*

  image:
    command: docker build -t schema-workspace-client:development .
    deps:
      - ~:build
    inputs:
      - Dockerfile
      - .dockerignore
      - nginx.conf
    options:
      cache: false

  test-unit:
    command: pnpm exec vitest run
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /packages/entity-cache/src/**/*

  lint:
    command: pnpm exec eslint src scripts tests playwright.config.ts webpack.config.ts
    deps:
      - ~:lint-architecture
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  lint-architecture:
    command: pnpm exec tsx scripts/check-architecture.ts
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /apps/editor/scripts/architecture/**/*

  lint-fix:
    command: pnpm exec eslint --fix src scripts tests playwright.config.ts webpack.config.ts
    local: true

  fmt:
    command: pnpm exec biome format --write .
    deps:
      - ~:fmt-markup
    options:
      cache: false
      runInCI: false

  fmt-markup:
    command: pnpm exec prettier --write index.html
    options:
      cache: false
      runInCI: false

  setup-browser:
    command: pnpm exec playwright install chromium
    options:
      cache: false
      runInCI: false

  test-e2e-mock:
    command: pnpm exec playwright test
    deps:
      - ~:build
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /apps/editor/src/**/*
      - /packages/entity-cache/src/**/*
    options:
      cache: false

  start-e2e:
    command: pnpm exec tsx scripts/serve-e2e.ts
    local: true
    options:
      persistent: true

  test-e2e-api:
    command: pnpm exec playwright test
    deps:
      - ~:build
      - ~:test-e2e-mock
      - server:image
    env:
      WORKSPACE_MODE: api
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - /apps/editor/src/**/*
      - /apps/server/src/**/*
      - /uv.lock
    options:
      cache: false

  test-e2e:
    command: pnpm exec playwright test
    deps:
      - ~:test-e2e-mock
      - ~:image
      - editor:image
      - server:image
    env:
      WORKSPACE_MODE: api
      WORKSPACE_CONTAINER: '1'
    options:
      cache: false

workspace:
  inheritedTasks:
    exclude:
      - typecheck
      - test-unit
      - lint
      - lint-fix
      - fmt
      - check
