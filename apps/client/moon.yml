language: typescript
type: application

fileGroups:
  configs:
    - package.json
    - tsconfig.json
    - '*.config.js'
  sources:
    - index.html
    - src/**/*
    - scripts/**/*
    - public/**/*

tasks:
  dev:
    command: pnpm dev
    deps:
      - editor:dev
    local: true
    options:
      persistent: true

  build:
    command: pnpm build
    deps:
      - editor:build
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    outputs:
      - dist

  typecheck:
    command: pnpm typecheck
    deps:
      - editor:build
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  test:
    command: pnpm test
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  lint:
    command: pnpm lint
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  lint-fix:
    command: pnpm lint:fix
    local: true

  fmt:
    command: pnpm exec biome format --write .
    deps:
      - ~:fmt-markup
    options:
      cache: false
      runInCI: false

  fmt-markup:
    command: pnpm exec prettier --write --no-error-on-unmatched-pattern index.html 'src/**/*.scss'
    options:
      cache: false
      runInCI: false
