language: python
type: application

fileGroups:
  src:
    - src/**/*.{py,sql,json}
  test-unit:
    - tests/unit/**/*.py
    - tests/conftest.py
  test-int:
    - tests/integration/**/*.py
    - tests/conftest.py
  test-e2e:
    - e2e/**/*.py
    - tests/support/**/*.py
  database:
    - tests/support/**/*.py
    - /env/local/docker-compose.database.yaml
    - /env/pgbouncer/*.{ini,txt}
  generator:
    - /tools/documents-generator/src/**/*.py
    - /tools/documents-generator/pyproject.toml

tasks:
  setup:
    command: uv run --no-sync python -m env.tools.lexical --directory nltk_data
    deps:
      - root:setup
    options:
      cache: false
      runInCI: false

  setup-runtime:
    script: uv sync --locked --no-dev --no-editable --package backend && uv run --no-sync python -m env.tools.lexical --directory nltk_data
    platform: system
    options:
      cache: false
      runInCI: false

  lint:
    command: uv run --no-sync ruff check src tests e2e
    inputs:
      - '@group(test-e2e)'
    options:
      mergeArgs: replace

  lint-fix:
    command: uv run --no-sync ruff check --fix src tests e2e
    inputs:
      - '@group(test-e2e)'
    options:
      mergeArgs: replace

  fmt:
    command: uv run --no-sync ruff format src tests e2e
    inputs:
      - '@group(test-e2e)'
    options:
      mergeArgs: replace

  typecheck:
    inputs:
      - '@group(database)'
      - '@group(test-e2e)'
      - '@group(generator)'

  test-unit:
    command: uv run --no-sync pytest tests/unit
    env:
      PYTHONPATH: $workspaceRoot
    inputs:
      - '@group(src)'
      - '@group(test-unit)'
      - '@group(fixtures)'
      - '@group(cfg)'
      - '@group(database)'
      - '@group(generator)'

  test-int:
    command: uv run --no-sync pytest tests/integration
    env:
      PYTHONPATH: $workspaceRoot
    inputs:
      - '@group(src)'
      - '@group(test-int)'
      - '@group(fixtures)'
      - '@group(cfg)'
      - '@group(database)'
      - '@group(generator)'
    options:
      cache: false

  test-e2e:
    command: uv run --no-sync pytest e2e
    deps:
      - image
    inputs:
      - '@group(src)'
      - '@group(test-e2e)'
      - '@group(cfg)'
      - '@group(database)'
    options:
      cache: false

  build:
    command: uv build --out-dir dist
    inputs:
      - '@group(src)'
      - '@group(cfg)'
    outputs:
      - dist

  image:
    command: docker build -f apps/server/Dockerfile -t schema-workspace-api:development .
    platform: system
    inputs:
      - '@group(src)'
      - '@group(cfg)'
      - Dockerfile
      - /.dockerignore
      - /env/docker/*.py
      - /tools/documents-generator/src/**/*.py
      - /tools/documents-generator/pyproject.toml
    options:
      runFromWorkspaceRoot: true
      cache: false

  start:
    command: uv run --no-sync python -m main
    preset: server

  start-e2e:
    command: uv run --no-sync python -m support.serve
    env:
      PYTHONPATH: tests
    preset: server

  test-int-corpus:
    command: uv run --no-sync python -m integration.evaluate --all --output ../../artifacts/inference-review --fail-on-forbidden
    env:
      PYTHONPATH: tests
    inputs:
      - '@group(src)'
      - '@group(test-int)'
      - '@group(fixtures)'
      - '@group(cfg)'
      - '@group(generator)'
    outputs:
      - /artifacts/inference-review
    options:
      runInCI: false
