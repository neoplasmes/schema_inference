language: python
type: application

tasks:
  lint:
    command: uv run --no-sync ruff check src tests

  fmt:
    command: uv run --no-sync ruff format src tests
    options:
      cache: false
      runInCI: false

  typecheck:
    command: uv run --no-sync pyright

  test-unit:
    command: uv run --no-sync pytest
    env:
      PYTHONPATH: $workspaceRoot
    options:
      cache: false

  build:
    command: uv build --out-dir dist
    outputs:
      - dist

  setup-runtime:
    command: uv sync --locked --no-dev --no-editable --package backend
    platform: system
    options:
      cache: false
      runInCI: false

  image:
    command: docker build -f apps/server/Dockerfile -t schema-workspace-api:development .
    platform: system
    inputs:
      - src/**/*
      - Dockerfile
      - pyproject.toml
      - /pyproject.toml
      - /uv.lock
      - /.dockerignore
      - /infrastructure/docker/**/*
    options:
      runFromWorkspaceRoot: true
      cache: false

  ci:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:test-unit
      - ~:build

  start:
    command: uv run --no-sync python -m main
    local: true
    options:
      persistent: true

  setup-wordnet:
    command: uv run --no-sync python -m env.tools.lexical --directory nltk_data
    local: true

  test-int-corpus:
    command: uv run --no-sync python -m integration.evaluate --all --output ../../artifacts/inference-review --fail-on-forbidden
    env:
      PYTHONPATH: tests
    options:
      cache: false
      runInCI: false
