language: python
type: application
dependsOn:
  - documents-generator

fileGroups:
  src:
    - src/**/*.{py,sql,json}
  test-unit:
    - tests/unit/**/*.py
    - tests/conftest.py
  test-int:
    - tests/integration/**/*.py
    - tests/conftest.py
  database:
    - /e2e/backend/**/*.py
    - /env/local/docker-compose.database.yaml
    - /env/pgbouncer/*.{ini,txt}
  generator:
    - /packages/documents_generator/src/**/*.py
    - /packages/documents_generator/pyproject.toml

tasks:
  lint:
    command: uv run --no-sync ruff check src tests
    options:
      mergeArgs: replace

  lint-fix:
    command: uv run --no-sync ruff check --fix src tests
    options:
      mergeArgs: replace

  fmt:
    command: uv run --no-sync ruff format src tests
    options:
      mergeArgs: replace

  typecheck:
    inputs:
      - '@group(database)'
      - '@group(generator)'

  test-unit:
    command: uv run --no-sync pytest tests/unit
    env:
      PYTHONPATH: $workspaceRoot
    inputs:
      - '@group(src)'
      - '@group(test-unit)'
      - '@group(fixtures)'
      - '@group(cfg)'
      - '@group(database)'
      - '@group(generator)'

  test-int:
    command: uv run --no-sync pytest tests/integration
    env:
      PYTHONPATH: $workspaceRoot
    inputs:
      - '@group(src)'
      - '@group(test-int)'
      - '@group(fixtures)'
      - '@group(cfg)'
      - '@group(database)'
      - '@group(generator)'
    options:
      cache: false

  build:
    command: uv build --out-dir dist
    inputs:
      - '@group(src)'
      - '@group(cfg)'
    outputs:
      - dist

  setup-runtime:
    command: uv sync --locked --no-dev --no-editable --package backend
    platform: system
    options:
      cache: false
      runInCI: false

  image:
    command: docker build -f apps/server/Dockerfile -t schema-workspace-api:development .
    platform: system
    inputs:
      - '@group(src)'
      - '@group(cfg)'
      - Dockerfile
      - /.dockerignore
      - /env/docker/*.py
      - /packages/documents_generator/src/**/*.py
      - /packages/documents_generator/pyproject.toml
    options:
      runFromWorkspaceRoot: true
      cache: false

  start:
    command: uv run --no-sync python -m main
    preset: server

  setup-wordnet:
    command: uv run --no-sync python -m env.tools.lexical --directory nltk_data
    options:
      cache: false
      runInCI: false

  test-int-corpus:
    command: uv run --no-sync python -m integration.evaluate --all --output ../../artifacts/inference-review --fail-on-forbidden
    env:
      PYTHONPATH: tests
    inputs:
      - '@group(src)'
      - '@group(test-int)'
      - '@group(fixtures)'
      - '@group(cfg)'
      - '@group(generator)'
    outputs:
      - /artifacts/inference-review
    options:
      runInCI: false
