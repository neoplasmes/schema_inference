language: python
type: application

tasks:
  lint:
    command: uv run --no-sync poe lint

  fmt:
    command: uv run --no-sync poe fmt
    options:
      cache: false
      runInCI: false

  typecheck:
    command: uv run --no-sync poe typecheck

  test:
    command: uv run --no-sync poe test

  build:
    command: uv run --no-sync poe build
    outputs:
      - dist

  ci:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:test
      - ~:build

  start:
    command: uv run --no-sync poe start
    local: true
    options:
      persistent: true

  download-wordnet:
    command: uv run --no-sync poe download-wordnet
    local: true

  evaluate:
    command: uv run --no-sync poe evaluate
    options:
      cache: false
      runInCI: false
