language: python
type: application

tasks:
  lint:
    command: uv run --no-sync ruff check src tests

  fmt:
    command: uv run --no-sync ruff format src tests
    options:
      cache: false
      runInCI: false

  typecheck:
    command: uv run --no-sync pyright

  test:
    command: uv run --no-sync pytest

  build:
    command: uv build --out-dir dist
    outputs:
      - dist

  ci:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:test
      - ~:build

  start:
    command: uv run --no-sync python -m main
    local: true
    options:
      persistent: true

  download-wordnet:
    command: uv run --no-sync python -m env.tools.lexical --directory nltk_data
    local: true

  evaluate:
    command: uv run --no-sync python -m integration.evaluate --all --output ../../artifacts/inference-review --fail-on-forbidden
    env:
      PYTHONPATH: tests
    options:
      cache: false
      runInCI: false
