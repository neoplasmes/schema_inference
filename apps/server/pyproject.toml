[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "neoplasmes",email = "quiqqiqiu@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.3",
    "wordsegment==1.3.1",
    "fastapi==0.119.0",
    "pydantic==2.12.3",
    "uvicorn[standard]==0.38.0",
    "python-multipart==0.0.20",
    "websockets==15.0.1",
    "wsproto==1.2.0",
    "python-dotenv==1.1.1",
    "psycopg[binary]==3.2.10"
]


[project.scripts]
start = "main:start"

[tool.poetry]
packages = [
    { include = "core", from = "src" },
    { include = "app", from = "src" },
    { include = "env", from = "src" },
    { include = "api", from = "src" },
    { include = "shared", from = "src" },
    { include = "main.py", from = "src" },
]

[tool.uv.sources]
documents-generator = { workspace = true }

[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "documents-generator",
    "httpx==0.28.1",
    "testcontainers==4.13.2",
    "docker==7.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/app/use_cases/generate_schema/__init__.py" = ["I001"]
"src/core/entities/selected_schema_node/__init__.py" = ["I001"]
"src/core/processes/normalize_documents/__init__.py" = ["I001"]
"src/core/entities/probability_space/__init__.py" = ["I001"]
"src/core/entities/lexical/__init__.py" = ["I001"]
"src/app/use_cases/upload_documents/__init__.py" = ["I001"]
"src/app/use_cases/infer_schema/__init__.py" = ["I001"]
"src/api/http/schema/__init__.py" = ["I001"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "dist", "build"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "../.."
venv = ".venv"
extraPaths = ["src", "../.."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -ra"
filterwarnings = [
    "error",
    "ignore:The @wait_container_is_ready decorator is deprecated.*:DeprecationWarning:testcontainers.core.waiting_utils",
]
