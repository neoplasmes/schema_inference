language: system
type: configuration

fileGroups:
  cfg:
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - .pnpmfile.cjs
    - pyproject.toml
    - uv.lock
    - ty.toml
    - .prototools
    - lefthook.yml
    - .moon/**/*
  cfg-fmt:
    - biome.json
  tools-src:
    - tools/**/*.py
  tools-cfg:
    - tools/**/pyproject.toml
  bruno:
    - docs/bruno/**/*
    - tools/bruno/*.py
    - /apps/server/openapi.yaml

tasks:
  setup:
    script: proto install && pnpm install --frozen-lockfile --ignore-scripts && uv sync --all-packages --locked --no-python-downloads
    platform: system
    options:
      cache: false
      runInCI: false

  lock:
    command: noop
    deps:
      - root:lock-backend
      - root:lock-frontend
    options:
      cache: false
      runInCI: false

  lock-backend:
    command: uv lock
    platform: system
    options:
      cache: false
      runInCI: false

  lock-frontend:
    command: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
    platform: system
    options:
      cache: false
      runInCI: false

  lint:
    command: uv run --no-sync ruff check tools/documents-generator/src tools/bruno
    deps:
      - ~:lint-bruno
    platform: system
    inputs: &tools-inputs
      - '@group(tools-src)'
      - '@group(tools-cfg)'

  lint-bruno:
    command: uv run --no-sync python tools/bruno/coverage.py --spec apps/server/openapi.yaml --collection docs/bruno
    platform: system
    inputs:
      - '@group(bruno)'

  lint-fix:
    command: uv run --no-sync ruff check --fix tools/documents-generator/src tools/bruno
    platform: system
    inputs: *tools-inputs
    options:
      cache: false
      runInCI: false

  fmt:
    script: pnpm exec biome format --write --files-ignore-unknown=true package.json biome.json && uv run --no-sync ruff format tools/documents-generator/src tools/bruno
    platform: system
    deps:
      - ~:lint-fix
    inputs:
      - '@group(tools-src)'
      - '@group(tools-cfg)'
      - '@group(cfg-fmt)'
      - package.json
    options:
      cache: false
      runInCI: false

  typecheck:
    command: uv run --no-sync pyright -p tools/documents-generator
    platform: system
    inputs: *tools-inputs

  check:
    command: noop
    deps:
      - ~:fmt
      - ~:lint-fix
      - ~:typecheck
    options:
      runInCI: false

  test-e2e-bruno:
    script: pnpm exec sh -c 'cd docs/bruno && bru run --env local -r'
    platform: system
    deps:
      - env:compose-up-server
    inputs:
      - '@group(bruno)'
    options:
      cache: false
      runInCI: false

  test-e2e-bruno-cluster:
    script: pnpm exec sh -c 'cd docs/bruno && bru run --env cluster -r'
    platform: system
    deps:
      - env:deploy
    inputs:
      - '@group(bruno)'
    options:
      cache: false
      runInCI: false

  build:
    command: uv run --no-sync documents-generator --output tools/documents-generator/generated --scenario all --documents 100 --seed 42
    platform: system
    inputs: *tools-inputs
    outputs:
      - tools/documents-generator/generated
