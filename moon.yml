language: system
type: configuration

fileGroups:
  formatting:
    - biome.json
    - package.json
    - prettier.config.js
    - .zed/settings.json

tasks:
  lint:
    deps:
      - client:lint
      - editor:lint
      - entity-cache:lint
      - server:lint
      - documents-generator:lint

  fmt:
    command: pnpm exec biome format --write @files(formatting)
    platform: node
    deps:
      - client:fmt
      - editor:fmt
      - server:fmt
      - documents-generator:fmt
    options:
      cache: false
      runInCI: false

  fmt-files:
    command: pnpm exec biome format --write --files-ignore-unknown=true --no-errors-on-unmatched
    platform: node
    options:
      cache: false
      runInCI: false

  fmt-markup-files:
    command: pnpm exec prettier --write --ignore-unknown
    platform: node
    options:
      cache: false
      runInCI: false

  fmt-check:
    command: pnpm exec biome format --files-ignore-unknown=true --no-errors-on-unmatched
    platform: node
    options:
      cache: false
      runInCI: false

  typecheck:
    deps:
      - client:typecheck
      - editor:typecheck
      - entity-cache:typecheck
      - server:typecheck
      - documents-generator:typecheck

  test:
    deps:
      - client:test
      - editor:test
      - entity-cache:test
      - server:test

  build:
    deps:
      - client:build
      - server:build

  ci:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:test
      - ~:build
      - client:e2e
      - client:e2e-api

  install-frontend:
    command: pnpm install --frozen-lockfile --ignore-scripts
    platform: system
    options:
      cache: false
      runInCI: false

  setup-tools:
    command: proto install
    options:
      cache: false
      runInCI: false

  lock-backend:
    command: uv lock --upgrade
    platform: system
    options:
      cache: false
      runInCI: false

  install-backend:
    command: uv sync --all-packages --locked --no-python-downloads
    platform: system
    options:
      cache: false
      runInCI: false

  lock-frontend:
    command: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
    platform: system
    options:
      cache: false
      runInCI: false
