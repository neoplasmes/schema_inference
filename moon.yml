language: system
type: configuration

fileGroups:
  src:
    - apps/*/src/**/*.{py,sql,json,ts,tsx,css}
    - apps/editor/playground/*.ts
    - packages/*/src/**/*.{py,ts,tsx}
    - apps/*/scripts/*.ts
    - apps/editor/scripts/architecture/*.ts
    - env/docker/*.py
  tests:
    - apps/*/tests/**/*.{py,ts,xml,json,yaml,yml}
    - apps/editor/visual/*.ts
    - e2e/backend/**/*.py
  cfg:
    - .moon/tasks/*.yml
    - apps/*/Dockerfile
    - apps/*/.dockerignore
    - apps/*/nginx.conf
    - .dockerignore
    - apps/*/*.{json,js,ts}
    - apps/*/pyproject.toml
    - packages/*/*.{json,js,ts,toml}
    - /env/local/docker-compose*.yaml
    - env/pgbouncer/*.{ini,txt}
    - package.json
    - pyproject.toml
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - .pnpmfile.cjs
    - uv.lock
    - biome.json
    - prettier.config.js
  assets:
    - apps/*/index.html
    - apps/client/public/*.json
  generator-src:
    - tools/documents-generator/src/**/*.py
  generator-cfg:
    - tools/documents-generator/pyproject.toml
  formatting:
    - biome.json
    - package.json
    - prettier.config.js
    - .zed/settings.json

tasks:
  lint:
    command: noop
    inputs: &workspace-inputs
      - '@group(src)'
      - '@group(tests)'
      - '@group(cfg)'
      - '@group(assets)'
    deps:
      - client:lint
      - editor:lint
      - entity-cache:lint
      - server:lint
      - root:lint-generator
      - backend-e2e:lint
      - env:lint

  fmt:
    command: pnpm exec biome format --write @files(formatting)
    platform: node
    deps:
      - client:fmt
      - editor:fmt
      - entity-cache:fmt
      - server:fmt
      - root:fmt-generator
      - backend-e2e:fmt
    options:
      cache: false
      runInCI: false

  fmt-files:
    command: pnpm exec biome format --write --files-ignore-unknown=true --no-errors-on-unmatched
    platform: node
    options:
      cache: false
      runInCI: false

  fmt-markup-files:
    command: pnpm exec prettier --write --ignore-unknown
    platform: node
    options:
      cache: false
      runInCI: false

  typecheck:
    command: noop
    inputs: *workspace-inputs
    deps:
      - client:typecheck
      - editor:typecheck
      - entity-cache:typecheck
      - server:typecheck
      - root:typecheck-generator
      - backend-e2e:typecheck

  check:
    command: noop
    inputs: *workspace-inputs
    deps:
      - root:fmt
      - root:lint
      - root:typecheck
    options:
      runDepsInParallel: false
      runInCI: false

  test-unit:
    command: noop
    inputs: *workspace-inputs
    deps:
      - client:test-unit
      - editor:test-unit
      - entity-cache:test-unit
      - server:test-unit

  test-int:
    command: noop
    inputs: *workspace-inputs
    deps:
      - server:test-int

  test-e2e:
    command: noop
    inputs: *workspace-inputs
    deps:
      - client:test-e2e-mock
      - client:test-e2e-api
      - client:test-e2e
      - backend-e2e:test-e2e

  build:
    command: noop
    inputs: *workspace-inputs
    deps:
      - client:build
      - server:build
      - root:build-generator

  setup:
    command: noop
    deps:
      - root:setup-frontend
      - root:setup-backend
      - client:setup-browser
    options:
      cache: false
      runInCI: false
      runDepsInParallel: false

  setup-tools:
    command: proto install
    options:
      cache: false
      runInCI: false

  setup-frontend:
    command: pnpm install --frozen-lockfile --ignore-scripts
    platform: system
    deps:
      - root:setup-tools
    options:
      cache: false
      runInCI: false

  setup-backend:
    command: uv sync --all-packages --locked --no-python-downloads
    platform: system
    deps:
      - root:setup-tools
    options:
      cache: false
      runInCI: false

  lock:
    command: noop
    deps:
      - root:lock-backend
      - root:lock-frontend
    options:
      cache: false
      runInCI: false

  lock-backend:
    command: uv lock
    platform: system
    options:
      cache: false
      runInCI: false

  lock-frontend:
    command: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
    platform: system
    options:
      cache: false
      runInCI: false

  lint-generator:
    command: uv run --no-sync ruff check tools/documents-generator/src
    platform: system
    inputs: &generator-inputs
      - '@group(generator-src)'
      - '@group(generator-cfg)'

  lint-fix-generator:
    command: uv run --no-sync ruff check --fix tools/documents-generator/src
    platform: system
    inputs: *generator-inputs
    options:
      cache: false
      runInCI: false

  fmt-generator:
    command: uv run --no-sync ruff format tools/documents-generator/src
    platform: system
    deps:
      - root:lint-fix-generator
    inputs: *generator-inputs
    options:
      cache: false
      runInCI: false

  typecheck-generator:
    command: uv run --no-sync pyright -p tools/documents-generator
    platform: system
    inputs: *generator-inputs

  check-generator:
    command: noop
    deps:
      - root:fmt-generator
      - root:typecheck-generator
    inputs: *generator-inputs
    options:
      runInCI: false

  build-generator:
    command: uv run --no-sync documents-generator --output tools/documents-generator/generated --scenario all --documents 100 --seed 42
    platform: system
    inputs: *generator-inputs
    outputs:
      - tools/documents-generator/generated
