language: system
type: configuration

fileGroups:
  formatting:
    - biome.json
    - package.json
    - prettier.config.js
    - .zed/settings.json

tasks:
  lint:
    deps:
      - client:lint
      - entity-cache:lint
      - server:lint
      - documents-generator:lint

  fmt:
    command: pnpm exec biome format --write @files(formatting)
    platform: node
    deps:
      - client:fmt
      - editor:fmt
      - server:fmt
      - documents-generator:fmt
    options:
      cache: false
      runInCI: false

  fmt-files:
    command: pnpm exec biome format --write --files-ignore-unknown=true --no-errors-on-unmatched
    platform: node
    options:
      cache: false
      runInCI: false

  fmt-markup-files:
    command: pnpm exec prettier --write --ignore-unknown
    platform: node
    options:
      cache: false
      runInCI: false

  fmt-check:
    command: pnpm exec biome format --files-ignore-unknown=true --no-errors-on-unmatched
    platform: node
    options:
      cache: false
      runInCI: false

  typecheck:
    deps:
      - client:typecheck
      - entity-cache:typecheck
      - server:typecheck
      - documents-generator:typecheck

  test:
    deps:
      - client:test
      - entity-cache:test
      - server:test

  build:
    deps:
      - client:build
      - server:build

  ci:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:test
      - ~:build
