apiVersion: v1
kind: Secret
metadata:
  name: zitadel-masterkey
type: Opaque
stringData:
  masterkey: "${zitadel_masterkey}"
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-env
type: Opaque
stringData:
  ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "${zitadel_postgres_password}"
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${zitadel_database_password}"
  ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${zitadel_login_password}"
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-database
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "${zitadel_postgres_password}"
