apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel-login
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: server
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-login
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-login
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
      ports:
        - port: 5432
