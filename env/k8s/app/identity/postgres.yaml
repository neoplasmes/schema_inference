apiVersion: v1
kind: Service
metadata:
  name: zitadel-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: zitadel-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel-postgres
spec:
  serviceName: zitadel-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          envFrom:
            - secretRef:
                name: zitadel-database
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
