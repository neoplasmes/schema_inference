apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: pgbouncer
    files:
      - ../../../pgbouncer/pgbouncer.ini
      - ../../../pgbouncer/userlist.txt

secretGenerator:
  - name: database
    literals:
      - POSTGRES_USER=workspace
      - POSTGRES_PASSWORD=workspace
      - POSTGRES_DB=workspace
      - DATABASE_URL=postgresql://workspace:workspace@pgbouncer:6432/workspace

resources:
  - postgres.yaml
  - pgbouncer.yaml
