apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: server
    literals:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - UPLOAD_ROOT=/data/uploads
      - WORDNET_ROOT=/opt/wordnet
      - ALLOWED_ORIGINS=http://localhost:8080

resources:
  - deployment.yaml
  - service.yaml
  - uploads.yaml
  - service-monitor.yaml
