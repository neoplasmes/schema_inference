apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: server
    literals:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - UPLOAD_ROOT=/data/uploads
      - WORDNET_ROOT=/opt/wordnet
      - ALLOWED_ORIGINS=http://localhost:8080
      - AUTH_TRUST_GATEWAY=true
      - AUTH_CACHE_TTL=300
      - AUTH_COOKIE_SECURE=false
      - CACHE_PURGE_URL=http://gateway-internal:8081/souin-api/souin
      - CACHE_PURGE_USER=purger
      - AUTH_ISSUER=http://auth.localhost:8080
      - AUTH_INTERNAL_URL=http://zitadel:8080
      - AUTH_REDIRECT_URI=http://localhost:8080/auth/callback
      - AUTH_POST_LOGOUT_URI=http://localhost:8080/

resources:
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - uploads.yaml
  - service-monitor.yaml
  - network-policy.yaml
