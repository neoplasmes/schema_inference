apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: caddy
          image: schema-workspace-gateway:development
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: status
              containerPort: 8081
            - name: metrics
              containerPort: 2019
          env:
            - name: CACHE_REDIS_URL
              value: valkey:6379
          readinessProbe:
            httpGet:
              path: /healthz
              port: status
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: status
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gateway
        - name: tmp
          emptyDir: {}
