apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        - name: wait-valkey
          image: schema-workspace-gateway:development
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z valkey 6379; do sleep 1; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: caddy
          image: schema-workspace-gateway:development
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
          env:
            - name: CACHE_REDIS_URL
              value: valkey:6379
          envFrom:
            - secretRef:
                name: gateway
          readinessProbe:
            httpGet:
              path: /healthz
              port: internal
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: internal
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gateway
        - name: tmp
          emptyDir: {}
