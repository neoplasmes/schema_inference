worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format json escape=json '{"time":"$time_iso8601","host":"$host","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
    resolver_timeout 2s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    limit_req_zone $binary_remote_addr zone=telemetry:10m rate=20r/s;

    upstream server_backend {
        zone server_backend 64k;
        least_conn;
        server server-pods.schema-workspace.svc.cluster.local:8000 resolve;
        keepalive 16;
    }

    upstream client_backend {
        zone client_backend 64k;
        least_conn;
        server client-pods.schema-workspace.svc.cluster.local:8080 resolve;
        keepalive 16;
    }

    upstream editor_backend {
        zone editor_backend 64k;
        least_conn;
        server editor-pods.schema-workspace.svc.cluster.local:8080 resolve;
        keepalive 16;
    }

    upstream grafana_backend {
        zone grafana_backend 64k;
        server grafana.monitoring.svc.cluster.local:80 resolve;
        keepalive 8;
    }

    upstream faro_backend {
        zone faro_backend 64k;
        server alloy.monitoring.svc.cluster.local:12347 resolve;
        keepalive 8;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_next_upstream error timeout http_502 http_503;

    server {
        listen 8080 default_server;
        server_name localhost;
        client_max_body_size 20m;

        location = /workspace-runtime.json {
            default_type application/json;
            add_header Cache-Control no-store;
            return 200 '{"mode":"api","apiBaseUrl":"","telemetryUrl":"/collect"}';
        }

        location /api/ {
            proxy_pass http://server_backend;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /editor/ {
            proxy_pass http://editor_backend/;
        }

        location = /collect {
            limit_req zone=telemetry burst=40 nodelay;
            client_max_body_size 1m;
            proxy_pass http://faro_backend;
        }

        location / {
            proxy_pass http://client_backend;
        }
    }

    server {
        listen 8080;
        server_name grafana.localhost;

        location / {
            proxy_pass http://grafana_backend;
        }
    }

    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /stub_status {
            stub_status;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
