apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Schema workspace

configMapGenerator:
  - name: schema-workspace-dashboard
    files:
      - workspace.json
