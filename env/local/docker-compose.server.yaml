services:
  server:
    image: schema-workspace-api:development
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: '8000'
      DATABASE_URL: postgresql://workspace:workspace@pgbouncer:6432/workspace
      UPLOAD_ROOT: /data/uploads
      WORDNET_ROOT: /opt/wordnet
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:4173
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v2/schemas", timeout=2)']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  uploads:
