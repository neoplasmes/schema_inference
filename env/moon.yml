language: system
type: configuration

fileGroups:
  cfg:
    - local/docker-compose.database.yaml
    - local/docker-compose.server.yaml
    - local/docker-compose.client.yaml
    - pgbouncer/pgbouncer.ini
    - pgbouncer/userlist.txt
  k8s:
    - k8s/**/*
  src:
    - docker/*.py

tasks:
  lint:
    script: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.server.yaml -f env/local/docker-compose.client.yaml config --quiet && kubectl kustomize --load-restrictor LoadRestrictionsNone env/k8s/app > /dev/null
    platform: system
    inputs:
      - '@group(cfg)'
      - '@group(k8s)'
    options:
      runFromWorkspaceRoot: true

  lint-python:
    command: uv run --no-sync ruff check --config apps/server/pyproject.toml env/docker
    inputs:
      - '@group(src)'
      - /apps/server/pyproject.toml
    options:
      runFromWorkspaceRoot: true

  lint-fix-python:
    command: uv run --no-sync ruff check --fix --config apps/server/pyproject.toml env/docker
    inputs:
      - '@group(src)'
      - /apps/server/pyproject.toml
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  fmt:
    command: uv run --no-sync ruff format --config apps/server/pyproject.toml env/docker
    deps:
      - env:lint-fix-python
    inputs:
      - '@group(src)'
      - /apps/server/pyproject.toml
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  compose-up:
    command: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.server.yaml -f env/local/docker-compose.client.yaml up -d --wait --wait-timeout 120
    deps:
      - client:image
      - editor:image
      - server:image
    inputs:
      - '@group(cfg)'
    options: &compose-options
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mutex: workspace-compose

  compose-down:
    command: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.server.yaml -f env/local/docker-compose.client.yaml down --remove-orphans
    inputs:
      - '@group(cfg)'
    options: *compose-options

  compose-up-database:
    command: docker compose -f env/local/docker-compose.database.yaml up -d --wait --wait-timeout 120
    inputs:
      - local/docker-compose.database.yaml
      - pgbouncer/pgbouncer.ini
      - pgbouncer/userlist.txt
    options: *compose-options

  compose-down-database:
    command: docker compose -f env/local/docker-compose.database.yaml down
    inputs:
      - local/docker-compose.database.yaml
    options: *compose-options

  compose-up-server:
    command: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.server.yaml up -d --wait --wait-timeout 120
    deps:
      - server:image
    inputs:
      - '@group(cfg)'
    options: *compose-options

  compose-down-server:
    command: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.server.yaml down
    inputs:
      - '@group(cfg)'
    options: *compose-options

  cluster-up:
    command: k3d cluster create --config env/k8s/k3d.config.yaml
    platform: system
    options: &cluster-options
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mutex: workspace-cluster

  cluster-down:
    command: k3d cluster delete schema-workspace
    platform: system
    options: *cluster-options

  deploy:
    script: >-
      k3d image import -c schema-workspace schema-workspace-api:development schema-workspace-client:development schema-workspace-editor:development &&
      kubectl kustomize --load-restrictor LoadRestrictionsNone env/k8s/app | kubectl --context k3d-schema-workspace apply -f - &&
      kubectl --context k3d-schema-workspace -n schema-workspace rollout restart deployment/server deployment/client deployment/editor &&
      kubectl --context k3d-schema-workspace -n schema-workspace rollout status deployment --timeout 300s
    platform: system
    deps:
      - client:image
      - editor:image
      - server:image
    inputs:
      - '@group(cfg)'
      - '@group(k8s)'
    options: *cluster-options

