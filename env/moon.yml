language: system
type: configuration

fileGroups:
  cfg:
    - local/docker-compose.database.yaml
    - local/docker-compose.cache.yaml
    - local/docker-compose.identity.yaml
    - local/docker-compose.server.yaml
    - local/docker-compose.client.yaml
    - local/.env.example
    - pgbouncer/pgbouncer.ini
    - pgbouncer/userlist.example.txt
  k8s:
    - k8s/**/*
  src:
    - docker/*.py
    - cache/*.py
    - secrets/*.py
    - identity/*.py
  cache:
    - cache/Caddyfile.template
    - cache/Dockerfile

tasks:
  lint:
    script: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.cache.yaml -f env/local/docker-compose.identity.yaml -f env/local/docker-compose.server.yaml -f env/local/docker-compose.client.yaml config --quiet && kubectl kustomize --load-restrictor LoadRestrictionsNone env/k8s/app > /dev/null && kubectl kustomize env/k8s/monitoring/dashboards > /dev/null && uv run --no-sync python env/cache/caddyfile.py --spec apps/server/openapi.yaml --template env/cache/Caddyfile.template --output env/k8s/app/gateway/Caddyfile --check
    platform: system
    deps:
      - env:secrets
    inputs:
      - '@group(cfg)'
      - '@group(k8s)'
      - '@group(cache)'
      - /apps/server/openapi.yaml
    options:
      runFromWorkspaceRoot: true

  secrets:
    command: uv run --no-sync python env/secrets/generate.py
    inputs:
      - '@group(cfg)'
      - '@group(k8s)'
      - cache/Dockerfile
      - secrets/generate.py
    options:
      cache: false
      runFromWorkspaceRoot: true

  lint-python:
    command: uv run --no-sync ruff check --config apps/server/pyproject.toml env/docker env/cache env/secrets env/identity
    inputs:
      - '@group(src)'
      - /apps/server/pyproject.toml
    options:
      runFromWorkspaceRoot: true

  lint-fix-python:
    command: uv run --no-sync ruff check --fix --config apps/server/pyproject.toml env/docker env/cache env/secrets env/identity
    inputs:
      - '@group(src)'
      - /apps/server/pyproject.toml
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  fmt:
    command: uv run --no-sync ruff format --config apps/server/pyproject.toml env/docker env/cache env/secrets env/identity
    deps:
      - env:lint-fix-python
    inputs:
      - '@group(src)'
      - /apps/server/pyproject.toml
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  build-cache-config:
    command: uv run --no-sync python env/cache/caddyfile.py --spec apps/server/openapi.yaml --template env/cache/Caddyfile.template --output env/k8s/app/gateway/Caddyfile
    deps:
      - server:build-openapi
    inputs:
      - /apps/server/openapi.yaml
      - cache/Caddyfile.template
      - cache/caddyfile.py
    outputs:
      - k8s/app/gateway/Caddyfile
    options:
      runFromWorkspaceRoot: true

  image-gateway:
    command: docker build -t schema-workspace-gateway:development -f env/cache/Dockerfile env/cache
    platform: system
    inputs:
      - '@group(cache)'
    options:
      runFromWorkspaceRoot: true

  compose-up:
    command: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.cache.yaml -f env/local/docker-compose.server.yaml -f env/local/docker-compose.client.yaml up -d --wait --wait-timeout 120
    deps:
      - env:secrets
      - client:image
      - editor:image
      - server:image
    inputs:
      - '@group(cfg)'
    options: &compose-options
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mutex: workspace-compose

  compose-down:
    command: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.cache.yaml -f env/local/docker-compose.server.yaml -f env/local/docker-compose.client.yaml down --remove-orphans
    inputs:
      - '@group(cfg)'
    options: *compose-options

  compose-up-database:
    command: docker compose -f env/local/docker-compose.database.yaml up -d --wait --wait-timeout 120
    deps:
      - env:secrets
    inputs:
      - local/docker-compose.database.yaml
      - local/.env.example
      - pgbouncer/pgbouncer.ini
      - pgbouncer/userlist.example.txt
    options: *compose-options

  compose-down-database:
    command: docker compose -f env/local/docker-compose.database.yaml down
    inputs:
      - local/docker-compose.database.yaml
    options: *compose-options

  compose-up-server:
    command: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.cache.yaml -f env/local/docker-compose.server.yaml up -d --wait --wait-timeout 120
    deps:
      - env:secrets
      - env:bootstrap-identity-compose
      - server:image
    inputs:
      - '@group(cfg)'
    options: *compose-options

  compose-down-server:
    command: docker compose -f env/local/docker-compose.database.yaml -f env/local/docker-compose.cache.yaml -f env/local/docker-compose.server.yaml down
    inputs:
      - '@group(cfg)'
    options: *compose-options

  compose-up-identity:
    description: Start ZITADEL v4.7.0 with its own Postgres and the Login V2 UI; issuer http://localhost:8085, login UI http://localhost:8086/ui/v2/login
    command: docker compose -f env/local/docker-compose.identity.yaml up -d --wait --wait-timeout 180
    deps:
      - env:secrets
    inputs:
      - local/docker-compose.identity.yaml
      - local/.env.example
    options: *compose-options

  compose-down-identity:
    command: docker compose -f env/local/docker-compose.identity.yaml down
    inputs:
      - local/docker-compose.identity.yaml
    options: *compose-options

  bootstrap-identity-compose:
    description: Provision the compose ZITADEL (issuer http://localhost:8085) and write the server credentials to env/local/identity.env
    command: uv run --no-sync python env/identity/bootstrap.py --target compose --output env/local/identity.env
    deps:
      - env:compose-up-identity
    inputs:
      - identity/bootstrap.py
    options: *compose-options

  cluster-up:
    command: k3d cluster create --config env/k8s/k3d.config.yaml
    platform: system
    options: &cluster-options
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mutex: workspace-cluster

  cluster-down:
    command: k3d cluster delete schema-workspace
    platform: system
    options: *cluster-options

  deploy-monitoring:
    script: kubectl --context k3d-schema-workspace create namespace monitoring --dry-run=client -o yaml | kubectl --context k3d-schema-workspace apply -f - && kubectl --context k3d-schema-workspace apply -f env/k8s/monitoring/secret.yaml && helmfile -f env/k8s/helmfile.yaml -l group=monitoring sync && kubectl --context k3d-schema-workspace apply -k env/k8s/monitoring/dashboards
    platform: system
    deps:
      - env:secrets
    inputs:
      - '@group(k8s)'
    options: *cluster-options

  deploy:
    script: >-
      k3d image import -c schema-workspace schema-workspace-api:development schema-workspace-client:development schema-workspace-editor:development schema-workspace-gateway:development &&
      kubectl kustomize --load-restrictor LoadRestrictionsNone env/k8s/app | kubectl --context k3d-schema-workspace apply -f - &&
      helmfile -f env/k8s/helmfile.yaml -l group=identity sync &&
      kubectl --context k3d-schema-workspace -n schema-workspace rollout restart deployment/server deployment/client deployment/editor deployment/gateway &&
      kubectl --context k3d-schema-workspace -n schema-workspace rollout status deployment/client deployment/editor deployment/gateway deployment/zitadel deployment/zitadel-login --timeout 300s
    platform: system
    deps:
      - env:secrets
      - client:image
      - editor:image
      - server:image
      - env:image-gateway
      - env:build-cache-config
      - env:deploy-monitoring
    inputs:
      - '@group(cfg)'
      - '@group(k8s)'
    options: *cluster-options

  bootstrap-identity:
    description: Provision ZITADEL in the cluster (project, OIDC apps, bruno machine user, webhook) through the gateway on auth.localhost:8080 and store the server credentials in the server-identity Secret
    command: uv run --no-sync python env/identity/bootstrap.py --target cluster
    deps:
      - env:deploy
    inputs:
      - identity/bootstrap.py
    options: *cluster-options
