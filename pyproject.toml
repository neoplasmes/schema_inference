[tool.uv.workspace]
members = ["apps/server", "tools/documents-generator"]

[tool.uv]
exclude-newer = "2025-10-19T09:24:48Z"
python-downloads = "never"
python-preference = "only-system"

[dependency-groups]
dev = [
    "ruff==0.14.1",
    "pyright==1.1.406",
    "pytest==8.4.2",
    "ipykernel==6.30.1",
]

[tool.pytest.ini_options]
testpaths = ["apps/server/tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -ra"
filterwarnings = [
    "error",
    "ignore:The @wait_container_is_ready decorator is deprecated.*:DeprecationWarning:testcontainers.core.waiting_utils",
]
