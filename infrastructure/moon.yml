language: system
type: configuration

fileGroups:
  cfg:
    - /docker-compose.database.yaml
    - /docker-compose.yaml
    - /docker-compose.client.yaml
    - pgbouncer/pgbouncer.ini
    - pgbouncer/userlist.txt
  src:
    - docker/*.py

tasks:
  setup:
    command: proto install docker-compose
    options:
      cache: false
      runInCI: false

  lint:
    command: docker-compose -f docker-compose.database.yaml -f docker-compose.yaml -f docker-compose.client.yaml config --quiet
    inputs:
      - '@group(cfg)'
    options:
      runFromWorkspaceRoot: true

  compose-up:
    command: docker-compose -f docker-compose.database.yaml -f docker-compose.yaml -f docker-compose.client.yaml up -d --wait --wait-timeout 120
    deps:
      - client:image
      - editor:image
      - server:image
    inputs:
      - '@group(cfg)'
    options: &compose-options
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mutex: workspace-compose

  compose-down:
    command: docker-compose -f docker-compose.database.yaml -f docker-compose.yaml -f docker-compose.client.yaml down --remove-orphans
    inputs:
      - '@group(cfg)'
    options: *compose-options

  compose-up-database:
    command: docker-compose -f docker-compose.database.yaml up -d --wait --wait-timeout 120
    inputs:
      - /docker-compose.database.yaml
      - pgbouncer/pgbouncer.ini
      - pgbouncer/userlist.txt
    options: *compose-options

  compose-down-database:
    command: docker-compose -f docker-compose.database.yaml down
    inputs:
      - /docker-compose.database.yaml
    options: *compose-options

  compose-up-api:
    command: docker-compose -f docker-compose.database.yaml -f docker-compose.yaml up -d --wait --wait-timeout 120
    deps:
      - server:image
    inputs:
      - '@group(cfg)'
    options: *compose-options

  compose-down-api:
    command: docker-compose -f docker-compose.database.yaml -f docker-compose.yaml down
    inputs:
      - '@group(cfg)'
    options: *compose-options
