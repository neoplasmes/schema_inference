node:
  packageManager: pnpm
  dedupeOnLockfileChange: false

python:
  packageManager: uv
  plugin: https://github.com/moonrepo/plugins/releases/download/python_tool-v0.14.1/python_tool.wasm
  rootVenvOnly: true
  venvName: .venv
  uv:
    syncArgs:
      - --all-packages
      - --locked
      - --no-python-downloads
