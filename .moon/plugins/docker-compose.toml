name = "Docker Compose"
type = "cli"

[platform.linux]
archs = ["x86_64", "aarch64"]
download-file = "docker-compose-linux-{arch}"
checksum-file = "docker-compose-linux-{arch}.sha256"

[install]
download-url = "https://github.com/docker/compose/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/docker/compose/releases/download/v{version}/{checksum_file}"

[install.exes.docker-compose]
primary = true

[resolve]
versions = ["2.40.1"]
