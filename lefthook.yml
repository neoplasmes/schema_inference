assert_lefthook_installed: true

pre-commit:
  parallel: false
  jobs:
    - name: biome
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css}'
      run: moon run root:fmt-files -- {staged_files}
      stage_fixed: true

    - name: markup
      glob: '*.{scss,html}'
      run: moon run root:fmt-markup-files -- {staged_files}
      stage_fixed: true

    - name: client eslint
      root: apps/client/
      glob: 'apps/client/src/**/*.{ts,tsx}'
      run: moon run client:lint-fix --affected --status staged
      stage_fixed: true

    - name: ruff
      glob: '*.py'
      run: moon run server:fmt documents-generator:fmt backend-e2e:fmt --affected --status staged
      stage_fixed: true

    - name: lint and typecheck
      run: moon run :lint :typecheck
