[project]
name = "documents-generator"
version = "0.1.0"
description = "Repeated XML and YAML collections with known variant distributions"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
documents-generator = "documents_generator.cli:main"

[tool.poetry]
packages = [{ include = "documents_generator", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "../.."
venv = ".venv"
extraPaths = ["src"]
