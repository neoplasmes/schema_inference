language: python
type: tool

tasks:
  generate:
    command: uv run --no-sync poe generate
    outputs:
      - generated
    options:
      cache: false

  lint:
    command: uv run --no-sync poe lint

  typecheck:
    command: uv run --no-sync poe typecheck

  fmt:
    command: uv run --no-sync poe fmt
    options:
      cache: false
      runInCI: false
