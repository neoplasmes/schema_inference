name = "Python"
type = "language"

[platform.linux]
archs = ["x86_64", "aarch64"]
archive-prefix = "python"
download-file = "cpython-{version}+20251014-{arch}-unknown-linux-{libc}-install_only.tar.gz"
checksum-file = "SHA256SUMS"
exe-path = "bin/python3"
exes-dirs = ["bin"]

[platform.macos]
archs = ["x86_64", "aarch64"]
archive-prefix = "python"
download-file = "cpython-{version}+20251014-{arch}-apple-darwin-install_only.tar.gz"
checksum-file = "SHA256SUMS"
exe-path = "bin/python3"
exes-dirs = ["bin"]

[platform.windows]
archs = ["x86", "x86_64"]
archive-prefix = "python"
download-file = "cpython-{version}+20251014-{arch}-pc-windows-msvc-install_only.tar.gz"
checksum-file = "SHA256SUMS"
exe-path = "python.exe"
exes-dirs = ["Scripts"]

[install]
download-url = "https://github.com/astral-sh/python-build-standalone/releases/download/20251014/{download_file}"
checksum-url = "https://github.com/astral-sh/python-build-standalone/releases/download/20251014/{checksum_file}"

[install.arch]
x86 = "i686"

[install.exes.pip]
no-bin = true
shim-before-args = ["-m", "pip"]

[resolve]
versions = ["3.12.12"]
