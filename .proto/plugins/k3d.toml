name = "k3d"
type = "cli"

[install]
download-url = "https://github.com/k3d-io/k3d/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/k3d-io/k3d/releases/download/v{version}/{checksum_file}"
unpack = false

[install.exes.k3d]
exe-path = "k3d"
primary = true

[install.arch]
x86_64 = "amd64"
aarch64 = "arm64"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "k3d-linux-{arch}"
checksum-file = "checksums.txt"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "k3d-darwin-{arch}"
checksum-file = "checksums.txt"

[platform.windows]
archs = ["x64"]
download-file = "k3d-windows-{arch}.exe"
checksum-file = "checksums.txt"

[resolve]
git-url = "https://github.com/k3d-io/k3d"
